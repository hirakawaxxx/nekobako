<!doctype html>
<!--
  Open Graph / Twitter card source (Soft Mint, light only).
  Rendered to public/og.png by scripts/build-og.mjs (1200×630).
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="only light" />
    <link rel="stylesheet" href="../../public/tokens.css" />
    <link rel="stylesheet" href="../icon/icon.css" />
    <link rel="stylesheet" href="og.css" />
  </head>
  <body>
    <div class="card" role="img" aria-label="ねこばこ">
      <div class="motif" aria-hidden="true">
        <div class="icon" id="icon">
          <div class="box">
            <div class="cat">
              <span class="ear ear--l"></span>
              <span class="ear ear--r"></span>
              <span class="face">
                <span class="eye eye--l"></span>
                <span class="eye eye--r"></span>
                <span class="nose"></span>
              </span>
            </div>
            <div class="front"></div>
          </div>
        </div>
      </div>
      <div class="copy">
        <h1 class="title">ねこばこ</h1>
        <p class="lead">猫を落として、合体させよう。</p>
        <p class="url">neko.app.hirakawaxxx.com</p>
      </div>
    </div>
  </body>
</html>
